<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != "/" %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav aria-label="Documentation">
      {% for item in site.nav %}
      <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
      <a href="{{ site.repository_url }}">GitHub</a>
    </nav>
  </header>
  <main id="content" class="content">
    {{ content }}
  </main>
  <footer class="site-footer">
    <a href="{{ site.repository_url }}/edit/main/docs/{{ page.path }}">Edit this page</a>
    · <a href="{{ site.repository_url }}/issues/new">Report a problem</a>
  </footer>
  <script type="module" src="{{ '/assets/js/diagrams.js' | relative_url }}"></script>
</body>
</html>
